name: Migration Drift Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'prisma/schema.prisma'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'prisma/schema.prisma'

jobs:
  migration-drift:
    name: Migration Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref vatsmyvkeuxkcwemmxau
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Show migration status
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check for pending migrations
        run: |
          OUTPUT=$(supabase db push --dry-run 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "would apply"; then
            echo ""
            echo "❌ Pending migrations found. Run 'supabase db push' locally to apply."
            exit 1
          fi
          echo ""
          echo "✅ All migrations applied. No drift detected."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
