name: Migration Drift Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  migration-drift:
    name: Migration Drift Check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref vatsmyvkeuxkcwemmxau

      - name: Check for pending migrations
        run: |
          supabase migration list
          OUTPUT=$(supabase db push --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "would apply\|pending"; then
            echo ""
            echo "❌ Pending migrations found. Run 'supabase db push' locally."
            exit 1
          fi
          echo ""
          echo "✅ All migrations applied. No drift detected."
