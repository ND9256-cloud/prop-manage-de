name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
        continue-on-error: true
