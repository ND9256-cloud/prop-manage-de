doc_type: mietvertrag
schema_version: "2026-05-21-v1"
claim_kind: assertion
domain_knowledge_ref: domain_knowledge/mietvertrag.md

prompt_fragment_template: |
  ## Mietvertrag — extract the following fields

  For each field, return:
  - raw_value: verbatim text from the document
  - normalized_value: typed canonical form (see per-field instructions)
  - evidence: array of { quote: <verbatim quote>, page: <number>, bbox: null }. At least one entry required when absence_state == "present".
  - confidence: high | medium | low
  - absence_state: present | absent | illegible | ambiguous | contradicted | not_applicable | inferred | requires_human_review
  - validation_status: valid (set this; verifiers run separately)

  Evidence is MANDATORY when absence_state == present. The evidence array must contain at least one entry. Do not set a value without supporting evidence quotes.

  ### kaltmiete (Kaltmiete — base rent, monthly, EUR)

  Extract ONLY the base rent excluding Nebenkosten. Accept synonyms: Grundmiete, Nettomiete, Nettokaltmiete.
  REJECT (set absence_state: ambiguous) if the contract uses Bruttomiete, Inklusivmiete, or Warmmiete — these bundle operating costs and the Kaltmiete component is not separately stated.
  normalized_value: integer in minor units (cents) + currency code, e.g. { amount: 65000, currency: "EUR" } for €650.00.

  ### unit_ref (Einheit — normalized floor/position identifier)

  Extract from the filled-in unit specification, NOT from template boilerplate or headers.
  Normalize to one of: EG, 1.OG, 2.OG, 3.OG, 4.OG, DG, Keller, Souterrain.
  Common mappings: "Erdgeschoss" → EG; "1. Obergeschoss" → 1.OG; "Dachgeschoss" → DG.
  If multiple units are listed (a single lease covering multiple units), extract the unit the lease primarily concerns; if genuinely ambiguous, set absence_state: ambiguous.

  ### tenant_identity (Mieter — the tenant party)

  Extract the tenant as written on the contract.
  normalized_value: { name: <full name as written>, is_legal_entity: <bool>, legal_form: <optional string for entities> }.
  Legal-entity indicators: GmbH, UG, AG, eG, GbR, KG, OHG appearing in the name. Set is_legal_entity: true and populate legal_form with the matching abbreviation.
  For multiple co-tenants (Mietgemeinschaft), extract the first named tenant only.

  ### landlord_identity (Vermieter — the landlord party)

  Extract the landlord as written on the contract. Structurally identical to tenant_identity.
  normalized_value: { name: <full name or entity name>, is_legal_entity: <bool>, legal_form: <optional string for entities> }.
  Legal-entity indicators: GmbH, UG, AG, eG, GbR, KG, OHG, e.V., GmbH & Co. KG. Set is_legal_entity: true and populate legal_form.
  For multiple landlords / joint ownership, extract the named entity (e.g., "Denn & Denn Verwaltungs GbR") OR the first listed natural person if no entity is named.

  ### nebenkostenvorauszahlung (Nebenkostenvorauszahlung — monthly advance for Nebenkosten, EUR, optional)

  Extract the monthly advance payment for Nebenkosten/Betriebskosten, separately stated from Kaltmiete. Synonyms: NK-Vorauszahlung, Betriebskostenvorauszahlung, Vorauszahlung Nebenkosten.
  If the contract uses Inklusivmiete or only states Warmmiete without breaking out NK, set absence_state: ambiguous.
  If the contract genuinely doesn't include NK, set absence_state: not_applicable.
  normalized_value: integer in minor units (cents) + currency code, e.g. { amount: 18000, currency: "EUR" } for €180.00.

  ### kaution (Kaution — security deposit, EUR, optional)

  Kaution oder Mietsicherheit, vom Mieter beim Vermieter zu hinterlegen.

  WICHTIG: In deutschen Mietverträgen erscheint dieses Konzept unter verschiedenen Bezeichnungen — alle bezeichnen denselben Sachverhalt:
  - "Kaution"
  - "Mietsicherheit"
  - "Barkaution"
  - "Sicherheitsleistung"
  - Auch Kombinationen wie "Mietsicherheit in Form einer Barkaution"

  Der Geldbetrag erscheint oft in Vorlagen mit umgebenden Unterstrichen, Punkten oder Strichen, etwa:
  - "__________1.100,00 €"
  - ". . . . . . . 1.950,00 Euro"
  - "in Höhe von _____ Euro"

  Suche im gesamten Dokument nach diesen Bezeichnungen und extrahiere den genannten Betrag, unabhängig von der umgebenden Formatierung. Der Betrag ist real auch dann, wenn das Vertragsformular Leerstellen oder Platzhalter um die Zahl herum aufweist.

  Extract the TOTAL kaution amount, not an installment. If the contract says "Kaution: 3 Monatsmieten" without a euro figure, set absence_state: ambiguous.
  If the contract is kautionsfrei, set absence_state: not_applicable.
  Falls KEINE dieser Bezeichnungen im Dokument vorkommt, setze absence_state: "absent".
  Falls die Bezeichnung vorkommt aber kein Betrag genannt wird, setze absence_state: "ambiguous" mit einer Erklärung.
  normalized_value: integer in minor units (cents) + currency code, e.g. { amount: 195000, currency: "EUR" } for €1,950.00.

  ### mietbeginn (Mietbeginn — lease start date)

  Extract the date the lease takes effect.
  normalized_value: ISO 8601 (YYYY-MM-DD). Source is typically DD.MM.YYYY — normalize.
  If the contract specifies "ab Übergabe" or similar without a concrete date, set absence_state: ambiguous.

  ### mietende (Mietende — lease end date, optional)

  Most German residential leases are open-ended (unbefristet). For those, set absence_state: not_applicable. NOT absence_state: absent — the difference is meaningful.
  If the contract specifies a fixed end date (Befristung), extract it. Format: ISO 8601 (YYYY-MM-DD).

fields:
  - id: kaltmiete
    german_label: "Kaltmiete"
    severity: critical
    requiredness: required
    type: money
    verifier_refs:
      - monetary-verbatim
    normalization_rule_ref: kaltmiete_excludes_nebenkosten
    description: |
      Die monatliche Grundmiete (base rent), excluding Nebenkosten/Betriebskosten.
      Always a monthly amount in EUR. Synonyms: Grundmiete, Nettomiete,
      Nettokaltmiete. Do NOT extract if the contract uses Bruttomiete or
      Inklusivmiete terminology — those bundle Nebenkosten and the Kaltmiete
      component cannot be cleanly separated; set absence_state: ambiguous.
    used_in_resolvers: true
    customer_visible: true

  - id: unit_ref
    german_label: "Einheit"
    severity: critical
    requiredness: required
    type: enum
    enum_values:
      - "EG"
      - "1.OG"
      - "2.OG"
      - "3.OG"
      - "4.OG"
      - "DG"
      - "Keller"
      - "Souterrain"
    verifier_refs:
      - enum
    description: |
      Normalized unit reference (Geschoss/floor identifier). Map common
      variants: "Erdgeschoss" → "EG"; "1. Obergeschoss" → "1.OG";
      "Dachgeschoss" → "DG". Extract from the filled-in unit field of the
      lease, NOT from template boilerplate or page headers (Paul case:
      template carried wrong address; only the filled-in fields are
      authoritative). If multiple units appear and the contract is for
      one specific unit, extract that one; if genuinely ambiguous, set
      absence_state: ambiguous.
    used_in_resolvers: true
    customer_visible: true

  - id: tenant_identity
    german_label: "Mieter"
    severity: critical
    requiredness: required
    type: structured
    item_schema:
      - field: name
        type: string
        required: true
      - field: is_legal_entity
        type: boolean
        required: true
      - field: legal_form
        type: string
        required: false
    description: |
      The tenant party to the lease. For natural persons, name is the full
      name as written (first + last). For legal entities (GmbH, UG, AG, eG,
      GbR), set is_legal_entity: true and populate legal_form (e.g., "GmbH").
      The legal_form distinction is operationally important: a legal-entity
      tenant signals a Gewerbemietvertrag risk (commercial lease misclassified
      as residential — see gewerbe_misclassification gotcha in domain knowledge).
      For Mietgemeinschaft (multiple tenants on one lease), extract the first
      named tenant; multi-tenant handling is Phase 2.
    used_in_resolvers: true
    customer_visible: true

  - id: mietbeginn
    german_label: "Mietbeginn"
    severity: critical
    requiredness: required
    type: date
    verifier_refs:
      - date-format
    description: |
      The date the lease takes effect. Format must be ISO 8601 (YYYY-MM-DD).
      Original document typically shows German format (DD.MM.YYYY); normalize.
      This is rarely missing in a Mietvertrag — if it appears missing,
      re-read the document carefully before setting absence_state: absent.
    used_in_resolvers: true
    customer_visible: true

  - id: mietende
    german_label: "Mietende"
    severity: important
    requiredness: optional
    type: date
    verifier_refs:
      - date-format
    description: |
      The date the lease ends, if fixed-term. Most German residential leases
      are unbefristet (open-ended) — in that case, set absence_state:
      not_applicable rather than omitting the field. The presence/absence
      pattern matters: "the lease has no end date because it's open-ended"
      is different information from "the document doesn't tell us." Format:
      ISO 8601 (YYYY-MM-DD).
    used_in_resolvers: false
    customer_visible: true

  - id: nebenkostenvorauszahlung
    german_label: "Nebenkostenvorauszahlung"
    severity: important
    requiredness: optional
    type: money
    verifier_refs:
      - monetary-verbatim
    description: |
      Monthly advance payment for Nebenkosten/Betriebskosten, separate
      from Kaltmiete. Synonyms: "Nebenkostenvorauszahlung", "NK-Vorauszahlung",
      "Betriebskostenvorauszahlung", "Vorauszahlung Nebenkosten". May appear
      as a separate line item alongside Kaltmiete or as a sum within a Warmmiete
      breakdown.

      If the contract uses Inklusivmiete or only states Warmmiete without
      breaking out NK, set absence_state: ambiguous. If the contract genuinely
      doesn't include NK (some commercial or short-term leases), set
      absence_state: not_applicable.

      normalized_value: integer in minor units (cents) + currency code,
      e.g. { amount: 18000, currency: "EUR" } for €180.00.
    used_in_resolvers: false
    customer_visible: true

  - id: kaution
    german_label: "Kaution"
    severity: important
    requiredness: optional
    type: money
    verifier_refs:
      - monetary-verbatim
    description: |
      Kaution oder Mietsicherheit, vom Mieter beim Vermieter zu hinterlegen.

      WICHTIG: In deutschen Mietverträgen erscheint dieses Konzept unter
      verschiedenen Bezeichnungen — alle bezeichnen denselben Sachverhalt:
      - "Kaution"
      - "Mietsicherheit"
      - "Barkaution"
      - "Sicherheitsleistung"
      - Auch Kombinationen wie "Mietsicherheit in Form einer Barkaution"

      Der Geldbetrag erscheint oft in Vorlagen mit umgebenden Unterstrichen,
      Punkten oder Strichen, etwa:
      - "__________1.100,00 €"
      - ". . . . . . . 1.950,00 Euro"
      - "in Höhe von _____ Euro"

      Suche im gesamten Dokument nach diesen Bezeichnungen und extrahiere
      den genannten Betrag, unabhängig von der umgebenden Formatierung.
      Der Betrag ist real auch dann, wenn das Vertragsformular Leerstellen
      oder Platzhalter um die Zahl herum aufweist.

      German residential leases cap kaution at 3x the monthly Kaltmiete
      per BGB §551 (Mietkautionsobergrenze). The deposit may be paid in
      up to 3 monthly installments by the tenant.

      Extract the TOTAL kaution amount, not an installment. If the contract
      says "Kaution: 3 Monatsmieten" without a specific euro figure, set
      absence_state: ambiguous (the resolver will compute 3 × kaltmiete
      separately — extraction's job is to capture explicit values only).

      If the contract is kautionsfrei (no deposit required), set
      absence_state: not_applicable.

      Falls KEINE dieser Bezeichnungen im Dokument vorkommt, setze
      absence_state: "absent".
      Falls die Bezeichnung vorkommt aber kein Betrag genannt wird, setze
      absence_state: "ambiguous" mit einer Erklärung.

      normalized_value: integer in minor units (cents) + currency code,
      e.g. { amount: 195000, currency: "EUR" } for €1,950.00 (3x €650 Kaltmiete).
    used_in_resolvers: false
    customer_visible: true

  - id: landlord_identity
    german_label: "Vermieter"
    severity: critical
    requiredness: required
    type: structured
    item_schema:
      - field: name
        type: string
        required: true
      - field: is_legal_entity
        type: boolean
        required: true
      - field: legal_form
        type: string
        required: false
    description: |
      The landlord party to the lease. Structurally identical to tenant_identity.
      For natural persons (e.g., "Petra Denn"), name is the full name as
      written. For legal entities (e.g., "Denn & Denn Verwaltungs GbR"),
      set is_legal_entity: true and populate legal_form (e.g., "GbR").

      German indicators that signal legal_entity: GmbH, UG, AG, eG, GbR,
      KG, OHG, e.V., GmbH & Co. KG.

      For Eigentümerwechsel scenarios (property ownership transfer), the
      landlord_identity in the original Mietvertrag may NOT match the
      current Vermieter — that's expected. The current Vermieter is
      determined by the most recent ownership document (Eigentümerwechsel
      Übergabeprotokoll or Kaufvertrag), not by re-extracting the Mietvertrag.
      Extraction's job is to capture what's written in THIS document.

      For multiple landlords (joint ownership like a GbR with multiple
      partners), extract the named entity (e.g., "Denn & Denn Verwaltungs GbR")
      OR the first listed natural person if no entity is named.
    used_in_resolvers: true
    customer_visible: true
